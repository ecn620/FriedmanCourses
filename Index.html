<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friedman MS Degree Planner</title>
    <meta name="description" content="Plan your Tufts Friedman School MS course of study and check degree requirements." />
    <style>
      html, body { margin: 0; padding: 0; background: #f4f2ec; }
      * { box-sizing: border-box; }
      #root { min-height: 100vh; }
      /* graceful message if JS is disabled */
      .nojs { font-family: Georgia, serif; color: #16334f; padding: 40px; max-width: 640px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript><div class="nojs">This planner needs JavaScript enabled in your browser.</div></noscript>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
